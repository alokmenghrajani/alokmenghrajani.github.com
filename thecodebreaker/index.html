  :root {
    --bg: #0f1117;
    --panel: #191c26;
    --panel-2: #212533;
    --line: #2c3142;
    --text: #e7e9f0;
    --muted: #8b90a3;
    --accent: #6c8cff;
    --good: #35d07f;
    --bad: #ff5d6c;
    --slot: #10131b;
    --peg-white: #f4f6ff;
    --fb-correct: #35d07f;   /* green, right color, right spot */
    --fb-wrong:   #ff9d3c;   /* orange, right color, wrong spot */
    /* fluid sizing, scales with viewport, no fixed breakpoints */
    --peg: clamp(1.9rem, 9vw, 2.6rem);
    --swatch: clamp(2rem, 9.5vw, 2.6rem);
    --fb: clamp(0.6rem, 2.8vw, 0.8rem);
    --gap: clamp(0.4rem, 2vw, 0.75rem);
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;              /* content scales to fit, never scrolls */
    background: radial-gradient(120% 60% at 50% -10%, #1b2030 0%, var(--bg) 60%);
    color: var(--text);
    font-family: 'Cause', "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    font-size: 1rem;                 /* user-agent normal size (≈16px) baseline */
    -webkit-text-size-adjust: 100%;
    /* no text selection, it interferes with dragging pegs */
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    -webkit-user-drag: none;
  }
  /* block native HTML5 element drag (the "globe" cursor), we handle drag via pointer events */
  .peg, .swatch, .drag-ghost { -webkit-user-drag: none; }
  .wrap {
    width: 92%;
    max-width: 34rem;
    margin: 0 auto;
    padding: 4% 0 5%;
    transform-origin: top center;   /* fit() scales from here when too tall */
  }
  header { text-align: center; margin-bottom: 4%; }
  h1 {
    font-size: clamp(1.6rem, 7vw, 2.2rem);
    letter-spacing: 0.06em;
    margin: 0 0 0.2em;
    font-weight: 800;
  }
  h1 span { display: inline-block; } /* per-letter palette colors set inline */
  .tag { color: var(--muted); font-size: clamp(0.85rem, 3.4vw, 1rem); margin: 0; padding: 0 4%; }

  .toolbar {
    display: flex;
    gap: 3%;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin: 4% 0 3%;
  }
  select, button {
    font: inherit;
    font-size: clamp(0.9rem, 3.6vw, 1.05rem);
    color: var(--text);
    background: var(--panel-2);
    border: 1px solid var(--line);
    border-radius: 0.7em;
    padding: 0.5em 0.8em;
    cursor: pointer;
    transition: transform .05s ease, border-color .15s ease, background .15s ease;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(180deg, #7d99ff, #5a7bff);
    border-color: transparent;
    color: #0b0e16;
    font-weight: 700;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }

  .board {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 1em;
    padding: 3.5%;
    box-shadow: 0 1.2rem 3rem -1.8rem #000;
  }
  .legend {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 4%;
    color: var(--muted);
    font-size: clamp(0.68rem, 2.9vw, 0.8rem);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 0 2% 2.5%;
  }
  /* flex layout so dots are optically centered with the text (font-agnostic) */
  .legend span { display: flex; align-items: center; gap: 0.35em; min-width: 0; }
  .legend span:last-child { justify-content: flex-end; }
  .legend .dot {
    width: 0.72em; height: 0.72em;
    border-radius: 50%;
    border: 1px solid var(--line);
    flex: 0 0 auto;
  }
  .legend .dot:not(:first-child) { margin-left: 0.35em; } /* extra space before the 2nd pair */
  .legend .dot.black { background: var(--fb-correct); border-color: transparent; }
  .legend .dot.white { background: var(--fb-wrong); border-color: transparent; }

  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--gap);
    padding: 2%;
    border-radius: 0.8em;
  }
  .row + .row { margin-top: 1.5%; }
  .row.clue { background: var(--panel-2); transition: box-shadow .15s ease, background .15s ease; }
  .row.guess { background: transparent; border: 1px dashed var(--line); }
  /* clue rows the submitted guess contradicts, where the solver should look */
  .row.clue.mismatch {
    background: rgba(255,93,108,.14);
    box-shadow: inset 0 0 0 2px var(--bad);
    animation: shake .45s ease;
  }
  @keyframes shake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  .pegs-code {
    display: flex;
    gap: var(--gap);
    flex: 1;
    min-width: 0;
  }
  .peg {
    width: var(--peg);
    height: var(--peg);
    border-radius: 50%;
    background: var(--slot);
    border: 1px solid var(--line);
    display: grid;
    place-items: center;
    box-shadow: inset 0 0.2rem 0.5rem -0.2rem #000;
    flex: 0 0 auto;
  }
  .peg.filled {
    border: none;
    box-shadow: inset 0 -0.35rem 0.7rem -0.35rem rgba(0,0,0,.55), 0 0.12rem 0.25rem -0.06rem rgba(0,0,0,.4);
  }
  .peg.placed { animation: pop .12s ease; } /* one-shot pop, only on newly placed pegs */
  .peg.slot { cursor: pointer; touch-action: none; }
  .peg.slot.filled { cursor: grab; }
  .peg.slot.drop-target { outline: 2px dashed var(--accent); outline-offset: 2px; }
  .peg.slot.source { opacity: .35; }
  .peg.pick { cursor: grab; touch-action: none; } /* tap = eyedropper, drag = copy onto a slot */
  .peg.pick:hover { outline: 2px solid var(--accent); outline-offset: 2px; }

  .drag-ghost {
    position: fixed;
    width: var(--peg); height: var(--peg);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 1000;
    opacity: .92;
    box-shadow: 0 0.5rem 1.1rem -0.3rem rgba(0,0,0,.6);
  }
  body.dragging { cursor: grabbing; }
  body.dragging * { cursor: grabbing !important; }

  .peg.slot.active { outline: 2px solid var(--accent); outline-offset: 2px; }

  .feedback {
    display: grid;
    grid-template-columns: repeat(2, var(--fb));
    grid-auto-rows: var(--fb);
    gap: calc(var(--fb) * 0.34);
    flex: 0 0 auto;
    justify-content: center;
  }
  .fb {
    width: var(--fb); height: var(--fb);
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--line);
  }
  .fb.black { background: var(--fb-correct); border-color: transparent; } /* correct spot is green */
  .fb.white { background: var(--fb-wrong); border-color: transparent; }   /* wrong spot is orange */

  .palette {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: clamp(0.5rem, 3vw, 0.9rem);
    margin: 5% 0 1%;
  }
  .swatch {
    width: var(--swatch);
    height: var(--swatch);
    border-radius: 50%;
    cursor: grab;
    touch-action: none;               /* let pointer-drag work on touch without scrolling */
    border: 2px solid transparent;
    box-shadow: inset 0 -0.35rem 0.7rem -0.35rem rgba(0,0,0,.55), 0 0.12rem 0.25rem -0.06rem rgba(0,0,0,.4);
    transition: transform .08s ease;
  }
  .swatch:hover { transform: scale(1.12); }
  .swatch.sel { border-color: #fff; transform: scale(1.12); }
  .swatch.used { opacity: .28; pointer-events: none; }

  .hint {
    text-align: center;
    color: var(--muted);
    font-size: clamp(0.85rem, 3.4vw, 1rem);
    min-height: 1.4em;
    margin: 3% 0 1%;
    padding: 0 3%;
  }
  .msg { text-align: center; font-size: clamp(0.95rem, 3.8vw, 1.15rem); font-weight: 600; min-height: 1.6em; margin-top: 2%; padding: 0 3%; }
  .msg.win { color: var(--good); }
  .msg.lose { color: var(--bad); }

  .actions { display: flex; justify-content: center; gap: 3%; margin-top: 3%; }

  .stat { color: var(--muted); font-size: clamp(0.8rem, 3.1vw, 0.9rem); }

  @keyframes pop { 0%{transform:scale(.5);opacity:0} 100%{transform:scale(1);opacity:1} }

  /* New-Puzzle modal (outside .wrap so fit()'s transform can't affect fixed positioning) */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 2000;
    display: flex; align-items: center; justify-content: center;
    padding: 5%;
    background: rgba(6,8,14,.72);
    -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
  }
  .modal-overlay[hidden] { display: none; }
  .modal {
    width: 100%; max-width: 22rem;
    max-height: 90vh; overflow-y: auto;   /* scroll if the content is taller than the viewport */
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 1em;
    padding: 6% 6% 5%;
    box-shadow: 0 1.5rem 3rem -1rem #000;
    animation: pop .12s ease;
  }
  /* guided tour */
  #tour { position: fixed; inset: 0; z-index: 3000; }   /* transparent layer that blocks the game */
  #tour[hidden] { display: none; }
  #tour-spot {
    position: fixed; z-index: 1;
    border-radius: 0.6em;
    border: 2px solid var(--accent);
    box-shadow: 0 0 0 9999px rgba(6,8,14,.74);           /* dims everything except the highlighted box */
    pointer-events: none;
    transition: left .25s ease, top .25s ease, width .25s ease, height .25s ease;
  }
  #tour-pop {
    position: fixed; z-index: 2;
    width: 17rem; max-width: 84vw;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 0.8em;
    padding: 1rem 1.1rem;
    box-shadow: 0 1rem 2.2rem -0.6rem #000;
    transition: left .25s ease, top .25s ease;
  }
  #tour-text { font-size: clamp(0.9rem, 3.4vw, 1rem); line-height: 1.5; color: var(--text); }
  #tour-text .dot { display: inline-block; width: 0.85em; height: 0.85em; border-radius: 50%; vertical-align: -0.08em; }
  #tour-text .dot.correct { background: var(--fb-correct); }
  #tour-text .dot.wrong { background: var(--fb-wrong); }
  .tour-actions { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; margin-top: 0.9rem; }
  #tour-count { color: var(--muted); font-size: 0.85rem; }
  .tour-btns { display: flex; gap: 0.4rem; }
  .tour-btns button { padding: 0.4em 0.7em; }
  .modal h2 {
    margin: 0 0 5%;
    text-align: center;
    font-size: clamp(1.1rem, 4.5vw, 1.35rem);
    letter-spacing: 0.06em;
  }
  .modal label {
    display: block;
    margin: 5% 0 1%;
    font-size: clamp(0.85rem, 3.4vw, 1rem);
    color: var(--muted);
  }
  .modal label output { float: right; color: var(--text); font-weight: 600; }
  .modal input[type=range] {
    width: 100%; margin: 2% 0 0;
    accent-color: var(--accent);
    cursor: pointer;
  }
  .modal .check {
    display: flex; align-items: center; gap: 0.55em;
    margin: 6% 0 0;
    color: var(--text); cursor: pointer;
    font-size: clamp(0.85rem, 3.4vw, 1rem);
  }
  .modal .check input { width: 1.1em; height: 1.1em; accent-color: var(--accent); cursor: pointer; }
  .modal-actions { display: flex; gap: 4%; margin-top: 7%; }
  .modal-actions button { flex: 1; }

  /* generating state: hide the form, show the spinner */
  #m-loading { display: none; text-align: center; padding: 2% 0 1%; }
  #modal.busy label, #modal.busy .modal-actions { display: none; } /* #modal is the overlay that gets .busy */
  #modal.busy #m-loading { display: block; }
  .spinner {
    width: 2.6rem; height: 2.6rem;
    margin: 2% auto 6%;
    border-radius: 50%;
    border: 0.28rem solid var(--line);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--muted); margin-top: 4%; font-size: clamp(0.85rem, 3.4vw, 1rem); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span style="color:#e6194b">T</span><span style="color:#f58231">h</span><span style="color:#ffe119">e</span> <span style="color:#3cb44b">C</span><span style="color:#42d4f4">o</span><span style="color:#4363d8">d</span><span style="color:#b048e0">e</span> <span style="color:#e6194b">B</span><span style="color:#f58231">r</span><span style="color:#ffe119">e</span><span style="color:#3cb44b">a</span><span style="color:#42d4f4">k</span><span style="color:#4363d8">e</span><span style="color:#b048e0">r</span></h1>
    <p class="tag">Minimal clues to deduce the code. Can you break it?</p>
  </header>

  <div class="toolbar">
    <button id="new">New Puzzle</button>
    <button id="help">How to Play</button>
  </div>

  <div class="board">
    <div class="legend">
      <span>Clues</span>
      <span><span class="dot black"></span>correct spot<span class="dot white"></span>wrong spot</span>
    </div>
    <div id="clues"></div>
    <div class="legend" style="padding-top:3.5%">
      <span>Your final guess</span>
      <span></span>
    </div>
    <div id="guessRow"></div>
  </div>

  <div class="palette" id="palette"></div>
  <div class="hint" id="hint"></div>

  <div class="actions">
    <button id="submit" class="primary">Submit Guess</button>
  </div>
  <div class="msg" id="msg"></div>
</div>

<div id="modal" class="modal-overlay" hidden>
  <div class="modal">
    <h2>New Puzzle</h2>
    <label>Code size <output id="v-slots">4</output>
      <input type="range" id="s-slots" min="3" max="6" value="4"></label>
    <label>Colors <output id="v-colors">6</output>
      <input type="range" id="s-colors" min="3" max="7" value="6"></label>
    <label>Difficulty <output id="v-diff">3 · Moderate</output>
      <input type="range" id="s-diff" min="1" max="5" value="3"></label>
    <label class="check"><input type="checkbox" id="s-repeat" checked> Colors may repeat</label>
    <div class="modal-actions">
      <button id="m-cancel">Cancel</button>
      <button id="m-go" class="primary">Generate</button>
    </div>
    <div id="m-loading">
      <div class="spinner"></div>
      <div class="loading-text">Generating…</div>
    </div>
  </div>
</div>

<div id="tour" hidden>
  <div id="tour-spot"></div>
  <div id="tour-pop">
    <div id="tour-text"></div>
    <div class="tour-actions">
      <span id="tour-count"></span>
      <span class="tour-btns">
        <button id="tour-skip">Skip</button>
        <button id="tour-prev">Back</button>
        <button id="tour-next" class="primary">Next</button>
      </span>
    </div>
  </div>
</div>

<script>
// 7 maximally-distinct hues (spread across the wheel, no red/pink or yellow/orange clashes)
const PALETTE = ['#e6194b','#f58231','#ffe119','#3cb44b','#42d4f4','#4363d8','#b048e0'];
//                red        orange    yellow    green     cyan      blue      purple

const STAR_LABELS = ['Gentle','Easy','Moderate','Tricky','Brutal'];

// current puzzle parameters: { s:slots, c:colors, r:repeat, d:difficulty(1-5), seed }
let cfg, secret, clues, guess, selColor, solved, hintsUsed, curSeed, curParams;

/* seeded RNG (mulberry32), same seed gives same puzzle */
let rng = Math.random;
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function makeSeed(){ return 1 + Math.floor(Math.random() * 65535); } // 1..65535 (keeps the seed short)

function randCode(slots, colors, repeat){
  if(repeat){
    const c=[];
    for(let i=0;i<slots;i++) c.push(Math.floor(rng()*colors));
    return c;
  }
  // distinct colors: shuffle indices, take first `slots`
  const idx=[...Array(colors).keys()];
  for(let i=idx.length-1;i>0;i--){ const j=Math.floor(rng()*(i+1)); [idx[i],idx[j]]=[idx[j],idx[i]]; }
  return idx.slice(0,slots);
}

function hasDup(code){ return new Set(code).size !== code.length; }

// standard Mastermind scoring
function score(guess, code){
  let black=0, white=0;
  const gLeft=[], cLeft=[];
  for(let i=0;i<code.length;i++){
    if(guess[i]===code[i]) black++;
    else { gLeft.push(guess[i]); cLeft.push(code[i]); }
  }
  const counts = {};
  for(const c of cLeft) counts[c]=(counts[c]||0)+1;
  for(const g of gLeft){ if(counts[g]>0){ white++; counts[g]--; } }
  return {black, white};
}

// count codes consistent with clues, within the deduction space (respects no-repeat rule)
function consistentCount(clueList, slots, colors, repeat, stopAt){
  let count=0, sample=null;
  const total = Math.pow(colors, slots);
  const code = new Array(slots).fill(0);
  for(let n=0;n<total;n++){
    let x=n;
    for(let i=0;i<slots;i++){ code[i]=x%colors; x=Math.floor(x/colors); }
    if(!repeat && hasDup(code)) continue;
    let ok=true;
    for(const cl of clueList){
      const s=score(cl.guess, code);
      if(s.black!==cl.fb.black || s.white!==cl.fb.white){ ok=false; break; }
    }
    if(ok){ count++; sample=code.slice(); if(stopAt && count>=stopAt) break; }
  }
  return {count, sample};
}

function buildPuzzle(){
  const {slots, colors, repeat, clues:nClues} = cfg;
  for(let attempt=0; attempt<400; attempt++){
    const code = randCode(slots, colors, repeat);
    const clueList = [];
    const seen = new Set();
    let tries=0;
    while(clueList.length < nClues && tries < 80){
      tries++;
      const g = randCode(slots, colors, repeat);
      const key = g.join(',');
      if(seen.has(key)) continue;
      if(g.every((v,i)=>v===code[i])) continue; // never hand over the answer
      seen.add(key);
      clueList.push({ guess:g, fb:score(g, code) });
    }
    let uniq = consistentCount(clueList, slots, colors, repeat, 2);
    let extra=0;
    while(uniq.count>1 && clueList.length < slots+12 && extra<80){
      extra++;
      const g = randCode(slots, colors, repeat);
      const key = g.join(',');
      if(seen.has(key) || g.every((v,i)=>v===code[i])) continue;
      seen.add(key);
      clueList.push({ guess:g, fb:score(g, code) });
      uniq = consistentCount(clueList, slots, colors, repeat, 2);
    }
    if(uniq.count===1) return { code, clueList: minimizeClues(clueList, slots, colors, repeat) };
  }
  const code = randCode(slots, colors, repeat);
  return { code, clueList: [] };
}

// prune redundant rows so removing ANY remaining row breaks uniqueness (minimal puzzle)
function minimizeClues(clueList, slots, colors, repeat){
  let changed = true;
  while(changed){
    changed = false;
    for(let i=0;i<clueList.length;i++){
      const without = clueList.slice(0,i).concat(clueList.slice(i+1));
      if(consistentCount(without, slots, colors, repeat, 2).count === 1){
        clueList.splice(i,1); changed = true; break; // still unique without row i, so it is redundant
      }
    }
  }
  return clueList;
}

// palette-aware difficulty score D (higher = harder); used to rank candidates for the difficulty slider
function ratePuzzle(clueList, slots, colors, repeat){
  // enumerate the deduction space the solver reasons over
  const codes=[]; const total=Math.pow(colors,slots);
  for(let n=0;n<total;n++){
    let x=n; const code=new Array(slots);
    for(let i=0;i<slots;i++){ code[i]=x%colors; x=Math.floor(x/colors); }
    if(!repeat && new Set(code).size!==slots) continue;
    codes.push(code);
  }
  const cons = clueList.map(cl=>{
    const s=new Set();
    for(let j=0;j<codes.length;j++){
      const sc=score(cl.guess, codes[j]);
      if(sc.black===cl.fb.black && sc.white===cl.fb.white) s.add(j);
    }
    return s;
  });
  // greedy most-informative-first: candidates left after the single best clue, and #steps
  let C=new Set(codes.map((_,j)=>j));
  const used=new Array(cons.length).fill(false);
  const curve=[C.size];
  while(C.size>1){
    let best=-1, bestsz=Infinity;
    for(let i=0;i<cons.length;i++){
      if(used[i]) continue;
      let sz=0; for(const j of C) if(cons[i].has(j)) sz++;
      if(sz<bestsz){ bestsz=sz; best=i; }
    }
    if(best<0) break;
    used[best]=true;
    const nc=new Set(); for(const j of C) if(cons[best].has(j)) nc.add(j); C=nc;
    curve.push(C.size);
  }
  const afterBest = curve.length>1 ? curve[1] : 1;
  const steps = curve.length-1;
  // colors the solver can eliminate outright from all-zero clues (palette collapse = easier)
  const killed = new Set();
  clueList.forEach(cl=>{ if(cl.fb.black===0 && cl.fb.white===0) cl.guess.forEach(c=>killed.add(c)); });
  return Math.log2(afterBest) + 0.6*(steps-1) - 1.5*killed.size;
}

/* rendering */
const $ = id => document.getElementById(id);

function pegEl(colorIdx){
  const d = document.createElement('div');
  d.className = 'peg';
  if(colorIdx!=null){
    d.classList.add('filled');
    d.style.background = PALETTE[colorIdx];
  }
  return d;
}

function feedbackEl(fb, slots){
  const wrap = document.createElement('div');
  wrap.className='feedback';
  const pegs = [];
  for(let i=0;i<fb.black;i++) pegs.push('black');
  for(let i=0;i<fb.white;i++) pegs.push('white');
  while(pegs.length<slots) pegs.push('');
  for(const t of pegs){
    const f=document.createElement('div');
    f.className='fb'+(t?' '+t:'');
    wrap.appendChild(f);
  }
  return wrap;
}

// element caches so we update in place instead of rebuilding (no flicker/blink)
let guessPegs = [];
let swatches = [];
let clueRows = [];

// paint a single peg's fill without touching its identity; `animate` plays a one-shot pop
function paintPeg(p, colorIdx, animate){
  const filled = colorIdx != null;
  p.classList.toggle('filled', filled);
  p.style.background = filled ? PALETTE[colorIdx] : '';
  if(animate && filled){
    p.classList.remove('placed');
    void p.offsetWidth;          // reflow so the animation restarts
    p.classList.add('placed');
  }
}

// full structural build, only when the puzzle changes
function buildBoard(){
  const {slots, colors} = cfg;

  const cl = $('clues'); cl.innerHTML=''; clueRows=[];
  clues.forEach(clue=>{
    const row=document.createElement('div'); row.className='row clue';
    const code=document.createElement('div'); code.className='pegs-code';
    clue.guess.forEach(ci=>{
      const p=pegEl(ci);
      p.classList.add('pick');
      p.title='Pick this color';
      p.addEventListener('click', ()=>{ if(suppressClick) return; selectColor(ci); }); // tap = eyedropper
      p.addEventListener('pointerdown', e=>onSwatchPointerDown(e,ci));                  // drag = copy, like palette
      code.appendChild(p);
    });
    row.appendChild(code);
    row.appendChild(feedbackEl(clue.fb, slots));
    clueRows.push(row);
    cl.appendChild(row);
  });

  const gr=$('guessRow'); gr.innerHTML=''; guessPegs=[];
  const row=document.createElement('div'); row.className='row guess';
  const code=document.createElement('div'); code.className='pegs-code';
  for(let i=0;i<slots;i++){
    const p=document.createElement('div');
    p.className='peg slot';
    p.dataset.idx=i;
    paintPeg(p, guess[i], false);
    p.addEventListener('click', ()=>{ if(suppressClick) return; placeAt(i); });
    p.addEventListener('pointerdown', e=>onPegPointerDown(e,i));
    guessPegs.push(p);
    code.appendChild(p);
  }
  row.appendChild(code);
  const spacer=document.createElement('div'); spacer.className='feedback';
  row.appendChild(spacer);
  gr.appendChild(row);

  const pal=$('palette'); pal.innerHTML=''; swatches=[];
  for(let i=0;i<colors;i++){
    const s=document.createElement('div');
    s.className='swatch';
    s.style.background=PALETTE[i];
    s.addEventListener('click',()=>{ if(suppressClick) return; selectColor(i); });
    s.addEventListener('pointerdown', e=>onSwatchPointerDown(e,i)); // drag a copy onto a slot
    swatches.push(s);
    pal.appendChild(s);
  }

  updateSwatches();
  updateSubmit();
  fit();
}

// scale the whole board down so it fits the viewport height (never scrolls, never scales up)
function fit(){
  const wrap = document.querySelector('.wrap');
  if(!wrap) return;
  wrap.style.transform = 'none';                 // measure natural height first
  const natural = wrap.offsetHeight;
  const s = Math.min(1, window.innerHeight / natural);
  wrap.style.transform = s < 1 ? `scale(${s})` : 'none';
}

// lightweight updates, touch only what changed, so nothing else repaints
function updateSwatches(){
  swatches.forEach((s,i)=>{
    s.classList.toggle('sel', selColor===i);
    s.classList.toggle('used', !cfg.repeat && guess.includes(i)); // no-repeat greying
  });
}
function updateSubmit(){ $('submit').disabled = solved || guess.some(v=>v==null); }

// mark clue rows the current guess contradicts (score(clue, guess) ≠ that clue's feedback)
function showMismatches(){
  clues.forEach((clue,i)=>{
    const s = score(clue.guess, guess);
    const bad = s.black!==clue.fb.black || s.white!==clue.fb.white;
    clueRows[i].classList.remove('mismatch');
    if(bad){ void clueRows[i].offsetWidth; clueRows[i].classList.add('mismatch'); } // restart flash
  });
}
function clearMismatches(){ clueRows.forEach(r=>r.classList.remove('mismatch')); }

function selectColor(i){
  selColor = i;
  updateSwatches();            // only the palette selection changes, no peg rebuild, no blink
}

// repaint guess pegs from state; pass an index to pop-animate the one just placed
function refreshGuess(animateIdx){
  guess.forEach((v,i)=> paintPeg(guessPegs[i], v, i===animateIdx));
  updateSwatches();
  updateSubmit();
  clearMismatches();          // guess changed, so the previous NO no longer applies
}

/* drag & drop (pointer-based, works on touch + mouse) */
let drag = null;
let suppressClick = false;

function startDrag(e, o){
  if(drag) return;                                  // a drag is already active. Ignore extra touches.
  drag = Object.assign({ pointerId:e.pointerId, startX:e.clientX, startY:e.clientY, moved:false, ghost:null }, o);
  window.addEventListener('pointermove', onPointerMove);
  window.addEventListener('pointerup', onPointerUp);
  window.addEventListener('pointercancel', onPointerCancel);
}
function onPegPointerDown(e, i){
  if(solved || guess[i]==null) return;              // only drag filled pegs
  startDrag(e, { from:i, color:guess[i] });         // from is a slot index, so move, swap, or clear
}
function onSwatchPointerDown(e, colorIdx){
  if(solved) return;
  startDrag(e, { from:null, color:colorIdx });      // from is null, so drag a copy from the palette
}

// tear down listeners and transient UI without applying any drop
function teardownDrag(){
  window.removeEventListener('pointermove', onPointerMove);
  window.removeEventListener('pointerup', onPointerUp);
  window.removeEventListener('pointercancel', onPointerCancel);
  document.body.classList.remove('dragging');
  document.querySelectorAll('.peg.slot.source').forEach(s=>s.classList.remove('source'));
  clearHighlight();
}

function onPointerMove(e){
  if(!drag || e.pointerId !== drag.pointerId) return; // only the finger that started the drag
  const dx = e.clientX - drag.startX, dy = e.clientY - drag.startY;
  if(!drag.moved && Math.hypot(dx, dy) < 6) return; // movement threshold tells a tap from a drag
  if(!drag.moved){
    drag.moved = true;
    const g = document.createElement('div');
    g.className = 'drag-ghost';
    g.style.background = PALETTE[drag.color];
    // size the ghost to the on-screen source (a guess peg when moving, else the palette swatch)
    const src = drag.from!=null ? guessPegs[drag.from] : swatches[drag.color];
    if(src){
      const r = src.getBoundingClientRect();
      g.style.width = r.width + 'px';
      g.style.height = r.height + 'px';
      if(drag.from!=null) src.classList.add('source'); // dim the moved peg. The palette swatch stays.
    }
    document.body.appendChild(g);
    drag.ghost = g;
    document.body.classList.add('dragging');
  }
  e.preventDefault();
  drag.ghost.style.left = e.clientX + 'px';
  drag.ghost.style.top  = e.clientY + 'px';
  highlight(e.clientX, e.clientY);
}

// a second touch or a browser gesture aborted the drag. Clean up, apply nothing.
function onPointerCancel(e){
  if(!drag || e.pointerId !== drag.pointerId) return;
  const d = drag; drag = null;
  if(d.ghost) d.ghost.remove();
  teardownDrag();
}

function onPointerUp(e){
  if(!drag || e.pointerId !== drag.pointerId) return;
  const d = drag; drag = null;
  if(d.ghost) d.ghost.remove();
  teardownDrag();
  if(!d.moved) return; // it was a tap, so let the click handler run (eyedropper or place)

  // A real drag happened, so swallow the synthetic click the touch or mouse will emit next.
  // This is flag based, not timed: the capture-phase click handler below consumes it, which avoids
  // a mobile race where the click fires in a later task than a setTimeout reset would.
  suppressClick = true;

  const el = document.elementFromPoint(e.clientX, e.clientY);
  const slot = el && el.closest('.peg.slot');
  const to = slot ? parseInt(slot.dataset.idx) : -1;
  if(d.from === null){
    // from the palette: drop a copy onto a slot. An off-slot drop does nothing, to avoid stray clears.
    if(to >= 0){
      if(!cfg.repeat){ const j = guess.indexOf(d.color); if(j!==-1 && j!==to) guess[j]=null; }
      guess[to] = d.color;
      selColor = d.color;
    }
  } else if(to >= 0){
    if(to !== d.from){                      // swap. The target may be empty, which is an effective move.
      const tmp = guess[to];
      guess[to] = d.color;
      guess[d.from] = tmp;
    }
  } else {
    guess[d.from] = null;                   // dragged a peg off the slots, so clear it
  }
  refreshGuess();
}

function highlight(x, y){
  clearHighlight();
  const el = document.elementFromPoint(x, y);
  const slot = el && el.closest('.peg.slot');
  if(slot) slot.classList.add('drop-target');
}
function clearHighlight(){
  document.querySelectorAll('.peg.slot.drop-target').forEach(s=>s.classList.remove('drop-target'));
}

function placeAt(i){
  if(solved) return;
  // clicking a filled slot picks up its color into the picker (eyedropper)
  if(guess[i]!=null && guess[i]!==selColor){
    selectColor(guess[i]);
    return;
  }
  // no-repeat: if selected color already sits in another slot, vacate that slot
  let cleared = -1;
  if(!cfg.repeat){
    const j = guess.indexOf(selColor);
    if(j!==-1 && j!==i){ guess[j]=null; cleared=j; }
  }
  guess[i] = selColor;
  if(cleared>=0) paintPeg(guessPegs[cleared], null, false);
  paintPeg(guessPegs[i], selColor, true);   // pop only the placed peg
  updateSwatches();
  updateSubmit();
  clearMismatches();
}

// build & render the exact puzzle described by params; push=true adds a browser-history entry
function startPuzzle(params, push){
  curParams = params;
  curSeed = params.seed >>> 0;
  cfg = { slots: params.s, colors: params.c, repeat: params.r, clues: params.s };
  rng = mulberry32(curSeed);              // deterministic: seed + params gives this exact puzzle
  const p = buildPuzzle();
  secret = p.code;
  clues = p.clueList;
  guess = new Array(cfg.slots).fill(null);
  selColor = 0;
  solved = false;
  hintsUsed = 0;
  writeState(push);
  $('msg').textContent=''; $('msg').className='msg';
  // human-readable summary of the puzzle parameters
  const rep = curParams.r ? 'repeat' : 'no repeat';
  $('hint').textContent =
    `Current puzzle: size ${curParams.s}, ${curParams.c} colors, ${rep}, ${STAR_LABELS[curParams.d-1].toLowerCase()}, seed ${curParams.seed}`;
  buildBoard();
}

/* puzzle generation targeting the difficulty slider */
// generate a batch of candidates for this config, then pick the one whose D-rank matches `difficulty`
function batchSize(slots, colors){
  const space = Math.pow(colors, slots);
  return space <= 2000 ? 30 : space <= 20000 ? 18 : 10;
}
function makeCandidate(slots, colors, repeat){
  const seed = makeSeed();
  rng = mulberry32(seed);
  const p = buildPuzzle();
  return p.clueList.length ? { seed, D: ratePuzzle(p.clueList, slots, colors, repeat) } : null;
}
// choose the candidate whose difficulty rank matches the slider (easiest to hardest)
function pickParams(cands, slots, colors, repeat, difficulty){
  if(!cands.length) return { s:slots, c:colors, r:repeat, d:difficulty, seed:makeSeed() };
  cands.sort((a,b)=>a.D-b.D);
  const idx = Math.round((difficulty-1)/4 * (cands.length-1));
  return { s:slots, c:colors, r:repeat, d:difficulty, seed:cands[idx].seed };
}
// synchronous generation, used at boot
function generateParams(slots, colors, repeat, difficulty){
  if(!repeat && colors < slots) colors = slots;    // no-repeat requires colors >= slots
  cfg = { slots, colors, repeat, clues: slots };
  const N = batchSize(slots, colors), cands = [];
  for(let k=0;k<N;k++){ const c = makeCandidate(slots, colors, repeat); if(c) cands.push(c); }
  return pickParams(cands, slots, colors, repeat, difficulty);
}
// chunked generation so the spinner keeps animating, shown for at least MIN_MS to avoid a flash.
function generateParamsAsync(slots, colors, repeat, difficulty, onDone){
  if(!repeat && colors < slots) colors = slots;
  cfg = { slots, colors, repeat, clues: slots };
  const N = batchSize(slots, colors), cands = [];
  const MIN_MS = 500;
  const t0 = performance.now();
  let k = 0;
  function step(){
    const end = Math.min(N, k + 2);                  // a couple of candidates per tick
    for(; k < end; k++){ const c = makeCandidate(slots, colors, repeat); if(c) cands.push(c); }
    if(k < N) setTimeout(step, 0);                   // yield between chunks to keep the UI responsive
    else {
      const rest = Math.max(0, t0 + MIN_MS - performance.now());
      setTimeout(()=>onDone(pickParams(cands, slots, colors, repeat, difficulty)), rest);
    }
  }
  setTimeout(step, 0);                               // yield first so the busy UI can paint
}

/* URL state: #<base64url(JSON)> + browser history */
// compact payload stored in the URL hash: {"w":size,"c":colors,"r":0|1,"d":difficulty,"s":seed}
function hashJSON(p){
  return JSON.stringify({ w:p.s, c:p.c, r:p.r?1:0, d:p.d, s:p.seed });
}
function encodeParams(p){
  return btoa(hashJSON(p)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeParams(str){
  try{
    let b = str.replace(/-/g,'+').replace(/_/g,'/'); while(b.length%4) b+='=';
    const o = JSON.parse(atob(b));
    const s=+o.w, d=+o.d, seed=+o.s, r=!!o.r;        // w=size, c=colors, r=repeat, d=difficulty, s=seed
    let c=+o.c;
    if(!(s>=2&&s<=6) || !(c>=2&&c<=PALETTE.length) || !(d>=1&&d<=5) || !(seed>=1&&seed<=65535)) return null;
    if(!r && c<s) c=s;                               // normalize invalid no-repeat combos
    return { s, c, r, d, seed };
  }catch(e){ return null; }
}
function writeState(push){
  const enc = encodeParams(curParams);
  if(location.hash.replace(/^#/,'') === enc) return;         // already current
  if(push) history.pushState({enc}, '', '#'+enc);            // new history entry (back returns here)
  else     history.replaceState({enc}, '', '#'+enc);
}
function parseHash(){ return decodeParams(location.hash.replace(/^#/,'')); }

function submit(){
  if(solved || guess.some(v=>v==null)) return;
  const correct = guess.every((v,i)=>v===secret[i]);
  const m=$('msg');
  if(correct){
    solved=true;
    m.textContent = 'YES';
    m.className='msg win';
    clearMismatches();
    updateSubmit();
  } else {
    m.textContent = 'NO. Check the highlighted clues.';
    m.className='msg lose';
    showMismatches();
  }
}

/* New-Puzzle modal */
function fmtDiff(v){ return `${v} · ${STAR_LABELS[v-1]}`; }
function syncModalLabels(){
  const slots = +$('s-slots').value;
  // no-repeat needs at least as many colors as slots, nudge the colors slider up if needed
  if(!$('s-repeat').checked && +$('s-colors').value < slots) $('s-colors').value = slots;
  $('v-slots').textContent  = slots;
  $('v-colors').textContent = $('s-colors').value;
  $('v-diff').textContent   = fmtDiff(+$('s-diff').value);
}
function openModal(){
  if(curParams){
    $('s-slots').value  = curParams.s;
    $('s-colors').value = curParams.c;
    $('s-diff').value   = curParams.d;
    $('s-repeat').checked = curParams.r;
  }
  syncModalLabels();
  $('modal').hidden = false;
}
function closeModal(){ $('modal').hidden = true; }
function modalBusy(){ return $('modal').classList.contains('busy'); }

/* guided tour: spotlight each part of the UI in turn */
const TOUR = [
  { target: null, text: 'Welcome to The Code Breaker. A secret code of colored pegs is hidden, and the clues give you just enough to deduce it. This quick tour shows you around.' },
  { target: '#clues', text: 'These rows are past guesses. Each colored peg is a color that was tried in that position.' },
  { target: '#clues .feedback', all: true, text: 'These dots beside each row are its feedback. A green dot (<span class="dot correct"></span>) means one peg is the right color in the right spot. An orange dot (<span class="dot wrong"></span>) means a right color in the wrong spot. The dots do not line up with the pegs they describe.' },
  { target: '#guessRow', text: 'Build your final guess in this row, one peg per slot.' },
  { target: '#palette', text: 'Pick colors here. Tap a color and then a slot to place it, or drag a color straight onto a slot. You can also drag pegs from the clues, and drag a peg off the slots to clear it.' },
  { target: '#submit', text: 'Press Submit to check. If your guess is wrong, the clue rows it contradicts light up, so you know where to look.' },
  { target: '#new', text: 'Use New Puzzle to change the size, number of colors, repeats, and difficulty. That is everything, have fun.' },
];
let tourIdx = 0;
// bounding box of the step target. With `all`, unions every match (e.g. all feedback columns)
function tourRect(step){
  if(!step.target) return null;
  const els = step.all ? [...document.querySelectorAll(step.target)]
                       : [document.querySelector(step.target)].filter(Boolean);
  if(!els.length) return null;
  let l=Infinity, t=Infinity, r=-Infinity, b=-Infinity;
  els.forEach(el=>{ const q=el.getBoundingClientRect(); l=Math.min(l,q.left); t=Math.min(t,q.top); r=Math.max(r,q.right); b=Math.max(b,q.bottom); });
  return { left:l, top:t, right:r, bottom:b, width:r-l, height:b-t };
}
function positionTour(){
  const step = TOUR[tourIdx], spot = $('tour-spot'), pop = $('tour-pop');
  const r = tourRect(step);
  if(r){
    const pad = 6;
    spot.style.display = 'block';
    spot.style.left = (r.left - pad) + 'px';
    spot.style.top = (r.top - pad) + 'px';
    spot.style.width = (r.width + 2*pad) + 'px';
    spot.style.height = (r.height + 2*pad) + 'px';
    const pw = pop.offsetWidth, ph = pop.offsetHeight, gap = 12;
    let top = r.bottom + gap;
    if(top + ph > window.innerHeight - 8) top = r.top - ph - gap;   // no room below, place above
    top = Math.max(8, Math.min(top, window.innerHeight - ph - 8));
    let left = r.left + r.width/2 - pw/2;
    left = Math.max(8, Math.min(left, window.innerWidth - pw - 8));
    pop.style.left = left + 'px'; pop.style.top = top + 'px';
  } else {
    spot.style.display = 'none';
    pop.style.left = (window.innerWidth/2 - pop.offsetWidth/2) + 'px';
    pop.style.top  = (window.innerHeight/2 - pop.offsetHeight/2) + 'px';
  }
}
function showTourStep(){
  const step = TOUR[tourIdx];
  $('tour-text').innerHTML = step.text;
  $('tour-count').textContent = `${tourIdx+1} / ${TOUR.length}`;
  $('tour-prev').disabled = tourIdx === 0;
  $('tour-next').textContent = tourIdx === TOUR.length-1 ? 'Done' : 'Next';
  positionTour();
}
function startTour(){ tourIdx = 0; $('tour').hidden = false; showTourStep(); window.addEventListener('resize', positionTour); }
function endTour(){ $('tour').hidden = true; window.removeEventListener('resize', positionTour); }

['s-slots','s-colors','s-diff','s-repeat'].forEach(id => $(id).addEventListener('input', syncModalLabels));
$('new').addEventListener('click', openModal);
$('help').addEventListener('click', startTour);
$('tour-skip').addEventListener('click', endTour);
$('tour-prev').addEventListener('click', ()=>{ if(tourIdx>0){ tourIdx--; showTourStep(); } });
$('tour-next').addEventListener('click', ()=>{ if(tourIdx>=TOUR.length-1) endTour(); else { tourIdx++; showTourStep(); } });
$('m-cancel').addEventListener('click', closeModal);
$('modal').addEventListener('click', e=>{ if(!modalBusy() && e.target===$('modal')) closeModal(); }); // backdrop
$('m-go').addEventListener('click', ()=>{
  if(modalBusy()) return;                           // ignore while a generation is running
  const s=+$('s-slots').value, c=+$('s-colors').value, d=+$('s-diff').value, r=$('s-repeat').checked;
  $('modal').classList.add('busy');                 // keep the dialog open, show the spinner
  generateParamsAsync(s, c, r, d, params=>{
    startPuzzle(params, true);
    $('modal').classList.remove('busy');
    closeModal();                                   // dismiss only once the puzzle is ready
  });
});

$('submit').addEventListener('click', submit);

// kill the browser's native drag (the globe/link cursor), we drive drag via pointer events
document.addEventListener('dragstart', e=>e.preventDefault());

// each new pointer interaction starts fresh (clears a stale flag from a drag that emitted no click)
document.addEventListener('pointerdown', ()=>{ suppressClick = false; }, true);
// consume the trailing synthetic click after a drag, before it reaches any peg/swatch handler
document.addEventListener('click', e=>{
  if(suppressClick){ e.stopPropagation(); e.preventDefault(); suppressClick = false; }
}, true);

// keep the board fitted to the viewport height
window.addEventListener('resize', fit);
window.addEventListener('orientationchange', fit);

// browser back or forward loads the puzzle encoded in the current URL, without pushing
window.addEventListener('popstate', ()=>{
  const p = parseHash();
  if(p) startPuzzle(p, false);
});

document.addEventListener('keydown', e=>{
  if(!cfg) return;
  if(!$('tour').hidden){
    if(e.key==='Escape') endTour();
    else if(e.key==='ArrowRight' || e.key==='Enter') $('tour-next').click();
    else if(e.key==='ArrowLeft') $('tour-prev').click();
    return;
  }
  if($('modal') && !$('modal').hidden){
    if(e.key==='Enter') $('m-go').click();
    else if(e.key==='Escape' && !modalBusy()) closeModal(); // cannot dismiss while generating
    return;
  }
  if(e.key>='1' && e.key<=String(cfg.colors)){
    const n=parseInt(e.key)-1;
    if(n<cfg.colors){ selectColor(n); }
  } else if(e.key==='Enter'){ submit(); }
});

// boot: load puzzle from URL if present, else generate a default one (replace, no history spam)
(function boot(){
  const p = parseHash();
  if(p) startPuzzle(p, false);
  else  startPuzzle(generateParams(4, 6, true, 3), false);
})();
</script>
